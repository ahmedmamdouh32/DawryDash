<section class="background-color">
    <!-- <div class="p-3"></div> -->
    <div class="text-center pt-4 pb-2">

        <h2 class="text-white fw-bold" style="font-size: 42px;">
            Continue Your Tournament Journey
        </h2>

        <p class="text-white-50 mt-2 mb-0" style="font-size: 20px;">
            Access your tournaments, teams, and live match dashboard.
        </p>

    </div>

    <div class="row background-color p-3 justify-content-center">
        <div class="col col-12 col-lg-4">
            <div class="green-border p-3" style="background-color: rgba(255, 255, 255, 0.1)">

                <label class=" text-white-50 mt-3 mb-1" style="font-size: 16px;">Email</label>
                <input class="form-control bg-white-black text-white-50 green-border" style="height:3rem" type="email"
                    placeholder="Enter Your Email">

                <label class="text-white-50 mt-3 mb-1" style="font-size: 16px;">Password</label>
                <input type="password" class="form-control text-white-50 bg-white-black green-border"
                    placeholder="Enter Your Password" style="height:3rem;">

                <div class="mt-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <input name="RememberMe" type="checkbox" class="custom-checkbox">
                        <span class=" text-white-50 ms-2" style="font-size: 14px;">Remember Me</span>
                    </div>
                    <div>
                        <a href="#" style="color: var(--accent);">Forgot Password?</a>
                    </div>
                </div>

                <div class="mt-3 mb-4">
                    <app-button size="medium" customClass="w-100">Login</app-button>
                </div>
            </div>
            <!-- or continue with -->
            <div class="my-3 d-flex justify-content-between align-items-center">
                <div class="green-border-top col-4">
                </div>
                <div>
                    <span class="text-white-50 col-3 m-0 p-0">or continue with</span>
                </div>
                <div class="green-border-top col-4">
                </div>
            </div>
            <div>

                <app-button variant="gray" customClass="w-100 my-2">
                    <div class="d-flex align-items-center justify-content-center">
                        <img src="google-colored.png" style="width: 24px;" class="mx-2">
                        <span style="font-weight: bold;">Continue with Google</span>
                    </div>
                </app-button>

                <app-button variant="gray" customClass="w-100 my-2">
                    <div class="d-flex align-items-center justify-content-center">
                        <img src="facebook-blue.png" style="width: 24px;" class="mx-2">
                        <span style="font-weight: bold;">Continue with Facebook</span>
                    </div>
                </app-button>
            </div>
            <div class="d-flex justify-content-center my-3">
                <span class="text-white-50">Do not have an account? <a href="#" style="font-weight: bold; color: var(--accent);">Sign Up</a> </span>
            </div>

        </div>

    </div>


</section>
